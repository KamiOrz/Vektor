<style>

<!-- Micro-interaction script -->
<script>
        // Simulate detection logic
        document.addEventListener('DOMContentLoaded', () => {
            const clipboardContainer = document.getElementById('clipboard-container');
            
            // Subtle floating animation for clipboard container
            let floatY = 0;
            let direction = 1;
            
            function animateFloat() {
                floatY += 0.05 * direction;
                if (Math.abs(floatY) > 5) direction *= -1;
                
                // We keep it subtle
                // clipboardContainer.style.transform = `translateY(${floatY}px)`;
                requestAnimationFrame(animateFloat);
            }
            
            animateFloat();

            // Toggle "Detection" simulation
            setInterval(() => {
                const scanner = document.querySelector('.corner-top-left').parentElement;
                // Add a "blink" effect when scanning "hits" something
                if (Math.random() > 0.8) {
                    scanner.classList.add('scale-[1.02]', 'brightness-125');
                    setTimeout(() => {
                        scanner.classList.remove('scale-[1.02]', 'brightness-125');
                    }, 150);
                }
            }, 3000);
        });
    </script>
